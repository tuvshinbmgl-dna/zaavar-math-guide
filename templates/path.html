{% extends "base.html" %}
{% block title %}Миний зам — Заавар{% endblock %}
{% block content %}
<script>window.__pathGrades = {{ grades|tojson }};</script>

<div x-data="learningPath(window.__pathGrades)" x-init="init()" class="max-w-xl mx-auto">

  <div class="mb-4">
    <h1 class="text-2xl font-extrabold text-ink-900">🧭 Миний зам</h1>
    <p class="text-sm text-slate-500 mt-1">Дараалан ур. Хичээл дуусгах бүрд <b>XP</b> цуглуулж, дараагийнх нь онгойно.</p>
  </div>

  <!-- анги сонгогч -->
  <div x-show="grades.length > 1" class="flex flex-wrap gap-2 mb-4">
    <template x-for="g in grades" :key="g.grade">
      <button @click="grade = g.grade; save()"
              :class="grade === g.grade ? 'bg-brand-600 text-white' : 'bg-white text-ink-700 border border-slate-200'"
              class="px-4 py-2 rounded-xl text-sm font-semibold min-h-[44px]" x-text="`${g.grade}-р анги`"></button>
    </template>
  </div>

  <!-- дүгнэлтийн хэсэг -->
  <div class="card p-4 mb-5 flex items-center justify-between gap-3">
    <div>
      <div class="text-xs font-semibold text-slate-500">Явц</div>
      <div class="text-lg font-extrabold text-ink-900" x-text="`${doneInGrade()}/${lessonsInGrade().length} хичээл`"></div>
    </div>
    <div class="flex-1 max-w-[12rem]">
      <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden">
        <div class="h-full bg-brand-500 transition-all duration-500"
             :style="`width:${lessonsInGrade().length ? Math.round(doneInGrade()/lessonsInGrade().length*100) : 0}%`"></div>
      </div>
    </div>
    <button @click="jumpToCurrent()" class="shrink-0 min-h-[44px] px-3 rounded-xl bg-brand-50 text-brand-700 text-sm font-bold">Үргэлжлүүлэх</button>
  </div>

  <!-- зам -->
  <div class="relative pb-10">
    <template x-for="(n, i) in nodesForGrade()" :key="n.kind + '-' + i">
      <div>
        <!-- Unit гарчиг -->
        <template x-if="n.kind === 'unit'">
          <div class="mt-7 mb-3">
            <div class="rounded-2xl px-4 py-3 text-white shadow-sm"
                 :class="unitColor(n.num)">
              <div class="text-[11px] font-bold uppercase tracking-wide opacity-80" x-text="`Бүлэг ${n.num}`"></div>
              <div class="font-extrabold leading-snug" x-text="n.title_mn"></div>
            </div>
          </div>
        </template>

        <!-- Хичээлийн зангилаа -->
        <template x-if="n.kind === 'lesson'">
          <div class="flex" :style="`justify-content:${offsetFor(i)}`">
            <div class="flex flex-col items-center gap-1 w-28">
              <button @click="open(n)"
                      :disabled="state(n) === 'locked'"
                      :title="state(n) === 'locked' ? 'Өмнөх хичээлээ дуусгавал онгойно' : n.title_mn"
                      class="relative w-16 h-16 rounded-full grid place-items-center text-2xl font-extrabold shadow-md transition
                             disabled:cursor-not-allowed active:scale-95"
                      :class="{
                        'bg-emerald-500 text-white': state(n) === 'done',
                        'bg-brand-600 text-white ring-4 ring-brand-200 animate-pulse-slow': state(n) === 'current',
                        'bg-white text-slate-300 border-2 border-slate-200': state(n) === 'locked'
                      }">
                <span x-show="state(n) === 'done'">★</span>
                <span x-show="state(n) === 'current'">▶</span>
                <span x-show="state(n) === 'locked'">🔒</span>
              </button>
              <div class="text-[11px] text-center leading-tight font-semibold"
                   :class="state(n) === 'locked' ? 'text-slate-400' : 'text-ink-700'"
                   x-text="n.title_mn"></div>
            </div>
          </div>
        </template>

        <!-- Хөтөлбөрт бий, гэхдээ хичээл хараахан бичигдээгүй -->
        <template x-if="n.kind === 'soon'">
          <div class="flex justify-center">
            <div class="flex flex-col items-center gap-1 w-28">
              <div class="w-16 h-16 rounded-full grid place-items-center text-xl bg-white border-2 border-dashed border-slate-200 text-slate-300"
                   title="Тун удахгүй нэмэгдэнэ">⋯</div>
              <div class="text-[11px] text-center leading-tight text-slate-400" x-text="n.title_mn"></div>
            </div>
          </div>
        </template>

        <!-- Бүлгийн шагнал -->
        <template x-if="n.kind === 'chest'">
          <div class="flex justify-center my-4">
            <div class="w-16 h-16 rounded-2xl grid place-items-center text-2xl shadow-sm"
                 :class="chapterDone(n.chapter) ? 'bg-amber-100' : 'bg-slate-100 opacity-50'"
                 :title="chapterDone(n.chapter) ? 'Бүлэг дуусгасан!' : 'Бүлгээ дуусгавал онгойно'">
              <span x-text="chapterDone(n.chapter) ? '🎁' : '📦'"></span>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!nodesForGrade().length">
      <div class="card p-6 text-center text-sm text-slate-500">Энэ ангийн хичээл тун удахгүй нэмэгдэнэ.</div>
    </template>
  </div>
</div>

<style>
  @keyframes pulseSlow { 0%,100% { box-shadow: 0 0 0 0 rgba(79,70,229,.35) } 50% { box-shadow: 0 0 0 10px rgba(79,70,229,0) } }
  .animate-pulse-slow { animation: pulseSlow 2.2s ease-in-out infinite; }
</style>

<script>
function learningPath(grades) {
  return {
    grades: grades || [],
    grade: null,
    done: {},

    init() {
      try { this.done = Progress.lessons || {}; } catch (e) { this.done = {}; }
      let saved = null;
      try { saved = Number(localStorage.getItem('zaavar.{{ subject }}.pathGrade')); } catch (e) {}
      const has = (g) => this.grades.some(x => x.grade === g);
      // Хамгийн бага дуусгаагүй анги нь хамгийн зөв "одоо байгаа" анги.
      let firstUnfinished = null;
      for (const g of this.grades) {
        const ls = g.nodes.filter(n => n.kind === 'lesson');
        if (ls.some(l => !this.done[l.lesson_id])) { firstUnfinished = g.grade; break; }
      }
      this.grade = (saved && has(saved)) ? saved
                 : (firstUnfinished !== null ? firstUnfinished
                 : (this.grades.length ? this.grades[0].grade : null));
    },
    save() { try { localStorage.setItem('zaavar.{{ subject }}.pathGrade', String(this.grade)); } catch (e) {} },

    gradeObj() { return this.grades.find(g => g.grade === this.grade) || { nodes: [] }; },
    nodesForGrade() { return this.gradeObj().nodes || []; },
    lessonsInGrade() { return this.nodesForGrade().filter(n => n.kind === 'lesson'); },
    doneInGrade() { return this.lessonsInGrade().filter(l => this.done[l.lesson_id]).length; },

    /* Түгжээний логик: дуусгасан → 'done'. Дуусгаагүй ЭХНИЙХ → 'current'.
       Түүнээс хойшхи бүгд → 'locked'. Ингэснээр зам үргэлж нэг л "дараагийн
       алхам" харуулна (Duolingo-гийн зарчим). */
    state(node) {
      if (this.done[node.lesson_id]) return 'done';
      const ls = this.lessonsInGrade();
      const firstOpen = ls.find(l => !this.done[l.lesson_id]);
      return firstOpen && firstOpen.lesson_id === node.lesson_id ? 'current' : 'locked';
    },
    chapterDone(ch) {
      const ls = this.lessonsInGrade().filter(l => l.chapter === ch);
      return ls.length > 0 && ls.every(l => this.done[l.lesson_id]);
    },

    /* Ороомог хэлбэр — 6 үе бүрээр зүүн/дунд/бараг тал руу шилжинэ. */
    offsetFor(i) {
      const p = ['center', 'flex-start', 'center', 'flex-end', 'center', 'flex-start'];
      return p[i % p.length];
    },
    unitColor(num) {
      const map = { I: 'bg-brand-600', II: 'bg-emerald-600', III: 'bg-amber-600',
                    IV: 'bg-rose-600', V: 'bg-indigo-600', VI: 'bg-teal-600' };
      return map[num] || 'bg-slate-700';
    },

    open(n) {
      if (this.state(n) === 'locked') return;
      window.location.href = '/lesson/' + n.lesson_id;
    },
    jumpToCurrent() {
      const ls = this.lessonsInGrade();
      const cur = ls.find(l => !this.done[l.lesson_id]);
      if (cur) { this.open(cur); return; }
      // бүгд дууссан — хөтөлбөр рүү
      window.location.href = '/curriculum';
    },
  };
}
</script>
{% endblock %}
